server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache static assets (Vite emits hashed filenames).
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: fall back to index.html for any unknown route so React Router can
    # handle client-side routing. index.html itself stays uncached so deploys
    # show up immediately.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # gzip text assets — keeps bundle response small without the Brotli ops cost.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
