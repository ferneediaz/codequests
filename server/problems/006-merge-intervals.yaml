id: problem-006-merge-intervals
title: Merge Intervals
difficulty: HARD
tags:
  - arrays
  - sorting
description: |
  Given an array of intervals where `intervals[i] = [starti, endi]`, merge all overlapping intervals, and return an array of the non-overlapping intervals that cover all the intervals in the input.

  **Example 1:**
  ```
  Input: [[1,3],[2,6],[8,10],[15,18]]
  Output: [[1,6],[8,10],[15,18]]
  ```

  **Example 2:**
  ```
  Input: [[1,4],[4,5]]
  Output: [[1,5]]
  ```
signature:
  name:
    javascript: merge
    python: merge
  params:
    - { name: intervals, type: 'int[][]' }
  returns: 'int[][]'
starter:
  javascript: |
    function merge(intervals) {
      // Your code here
      return [];
    }
  python: |
    def merge(intervals):
        # Your code here
        return []
tests:
  - { args: [[[1, 3], [2, 6], [8, 10], [15, 18]]], expected: [[1, 6], [8, 10], [15, 18]] }
  - { args: [[[1, 4], [4, 5]]],                    expected: [[1, 5]] }
  - { args: [[[1, 4], [0, 4]]],                    expected: [[0, 4]], hidden: true }
hints:
  - Merging is much easier when the intervals are processed in order. What should you sort by?
  - Sort by start time. Then the only way two intervals can overlap is if the next one starts before the current merged interval ends.
  - Walk through the sorted list and either extend the last merged interval's end or start a new one in the output list.
solution: |
  Sort the intervals by their start. Then iterate through them, keeping a running "current" interval. For each next interval, either extend the current one (when it overlaps) or push the current one to the result and start a new current interval.

  ```javascript
  function merge(intervals) {
      if (intervals.length === 0) return [];
      intervals.sort((a, b) => a[0] - b[0]);
      const result = [intervals[0].slice()];
      for (let i = 1; i < intervals.length; i++) {
          const last = result[result.length - 1];
          const [start, end] = intervals[i];
          if (start <= last[1]) {
              last[1] = Math.max(last[1], end);
          } else {
              result.push([start, end]);
          }
      }
      return result;
  }
  ```

  ```python
  def merge(intervals):
      if not intervals:
          return []
      intervals.sort(key=lambda iv: iv[0])
      result = [list(intervals[0])]
      for start, end in intervals[1:]:
          if start <= result[-1][1]:
              result[-1][1] = max(result[-1][1], end)
          else:
              result.append([start, end])
      return result
  ```

  The sort dominates, giving `O(n log n)` time and `O(n)` space for the output.
