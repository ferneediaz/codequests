id: problem-018-h-index
title: H-Index
difficulty: MEDIUM
tags:
  - arrays
  - sorting
  - counting
description: |
  Given an array of integers `citations` where `citations[i]` is the number of citations a researcher received for their `i`-th paper, return the researcher's **h-index**.

  The **h-index** is the largest integer `h` such that the researcher has published at least `h` papers that have each been cited at least `h` times.

  **Example 1:**
  ```
  Input: citations = [3,0,6,1,5]
  Output: 3
  Explanation: 3 papers have at least 3 citations each (the ones with 3, 6, and 5).
  ```

  **Example 2:**
  ```
  Input: citations = [1,3,1]
  Output: 1
  ```

  **Constraints:**
  - `n == citations.length`
  - `1 <= n <= 5000`
  - `0 <= citations[i] <= 1000`
signature:
  name:
    javascript: hIndex
    python: h_index
  params:
    - { name: citations, type: 'int[]' }
  returns: int
starter:
  javascript: |
    function hIndex(citations) {
      // Your code here
      return 0;
    }
  python: |
    def h_index(citations):
        # Your code here
        return 0
tests:
  - { args: [[3, 0, 6, 1, 5]],         expected: 3 }
  - { args: [[1, 3, 1]],                expected: 1 }
  - { args: [[0]],                      expected: 0 }
  - { args: [[100]],                    expected: 1, hidden: true }
  - { args: [[1, 1, 1, 1, 1]],          expected: 1, hidden: true }
hints:
  - Sorting citations in **descending** order makes the answer easy to spot — the h-index is the largest `h` for which the `h`-th paper (1-indexed) still has at least `h` citations.
  - Alternatively, build a counting bucket — index by min(citations[i], n), then sweep from the right summing counts. The first time the cumulative count meets the bucket index, that's `h`.
  - The bucket approach runs in `O(n)` time and `O(n)` space, beating sort by a log factor.
solution: |
  Two equally clean approaches:

  **Sort, then walk:** sort descending. Iterate and count how many papers have ≥ `i` citations until the property breaks.

  **Counting buckets (`O(n)`):** create an array `bucket[0..n]` where `bucket[c]` counts papers with `c` citations (anything above `n` is clamped to `n` because the h-index can't exceed `n`). Then sweep from the right, accumulating a running total — the first `i` where `total >= i` is the answer.

  ```javascript
  function hIndex(citations) {
      const n = citations.length;
      const bucket = new Array(n + 1).fill(0);
      for (const c of citations) bucket[Math.min(c, n)]++;
      let total = 0;
      for (let i = n; i >= 0; i--) {
          total += bucket[i];
          if (total >= i) return i;
      }
      return 0;
  }
  ```

  ```python
  def h_index(citations):
      n = len(citations)
      bucket = [0] * (n + 1)
      for c in citations:
          bucket[min(c, n)] += 1
      total = 0
      for i in range(n, -1, -1):
          total += bucket[i]
          if total >= i:
              return i
      return 0
  ```

  The counting solution is `O(n)` time and `O(n)` extra space.
