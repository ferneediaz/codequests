id: problem-002-reverse-string
title: Reverse String
difficulty: EASY
tags:
  - strings
  - two-pointers
description: |
  Write a function that reverses a string. The input string is given as an array of characters.

  You must do this by modifying the input array in-place with O(1) extra memory.

  **Input format:** A JSON array of single-character strings.
  **Output format:** The reversed array as compact JSON, e.g. `["o","l","l","e","h"]`.

  **Example 1:**
  ```
  Input: ["h","e","l","l","o"]
  Output: ["o","l","l","e","h"]
  ```

  **Example 2:**
  ```
  Input: ["H","a","n","n","a","h"]
  Output: ["h","a","n","n","a","H"]
  ```
