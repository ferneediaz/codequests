id: problem-030-find-the-index-of-the-first-occurrence-in-a-string
title: Find the Index of the First Occurrence in a String
difficulty: EASY
tags:
  - strings
  - two-pointers
  - string-matching
description: |
  Given two strings `needle` and `haystack`, return the index of the first occurrence of `needle` in `haystack`, or `-1` if `needle` is not part of `haystack`.

  **Example 1:**
  ```
  Input: haystack = "sadbutsad", needle = "sad"
  Output: 0
  Explanation: "sad" occurs at indices 0 and 6. The first occurrence is at 0.
  ```

  **Example 2:**
  ```
  Input: haystack = "leetcode", needle = "leeto"
  Output: -1
  ```

  **Constraints:**
  - `1 <= haystack.length, needle.length <= 10^4`
  - `haystack` and `needle` consist of only lowercase English letters.
signature:
  name:
    javascript: strStr
    python: str_str
  params:
    - { name: haystack, type: string }
    - { name: needle,   type: string }
  returns: int
starter:
  javascript: |
    function strStr(haystack, needle) {
      // Your code here
      return -1;
    }
  python: |
    def str_str(haystack, needle):
        # Your code here
        return -1
tests:
  - { args: ["sadbutsad", "sad"],       expected: 0 }
  - { args: ["leetcode", "leeto"],      expected: -1 }
  - { args: ["hello", "ll"],            expected: 2 }
  - { args: ["a", "a"],                 expected: 0, hidden: true }
  - { args: ["mississippi", "issip"],   expected: 4, hidden: true }
hints:
  - The straightforward approach — try each starting index `i` in `haystack` and check whether `haystack[i..i+needle.length]` matches `needle`. That's `O(n*m)` in the worst case but easy to write correctly.
  - Cap the outer loop at `i <= haystack.length - needle.length` — past that, there isn't enough room for `needle` to fit.
  - For `O(n + m)`, look up the **KMP** algorithm; it precomputes a prefix function so each character of `haystack` is examined a constant number of times.
solution: |
  The naive `O(n * m)` solution is fine for the given constraints (`length <= 10^4`):

  ```javascript
  function strStr(haystack, needle) {
      const n = haystack.length, m = needle.length;
      for (let i = 0; i <= n - m; i++) {
          let j = 0;
          while (j < m && haystack[i + j] === needle[j]) j++;
          if (j === m) return i;
      }
      return -1;
  }
  ```

  ```python
  def str_str(haystack, needle):
      n, m = len(haystack), len(needle)
      for i in range(n - m + 1):
          if haystack[i:i + m] == needle:
              return i
      return -1
  ```

  KMP brings this down to `O(n + m)` by precomputing a "longest proper prefix that is also a suffix" table for `needle` and never re-comparing characters that are guaranteed to match. For interview discussion it's worth knowing, but for these constraints the naive scan is plenty.
