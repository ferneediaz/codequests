id: problem-010-remove-duplicates-from-sorted-array
title: Remove Duplicates from Sorted Array
difficulty: EASY
tags:
  - arrays
  - two-pointers
description: |
  Given an integer array `nums` sorted in **non-decreasing** order, remove duplicates so that each unique element appears only once. The relative order of elements should stay the same.

  > **Note:** the original LeetCode version asks you to mutate `nums` in place and return only the new length. To keep grading deterministic this version asks you to return the deduplicated array directly. The two-pointer algorithm is identical.

  **Example 1:**
  ```
  Input: nums = [1,1,2]
  Output: [1,2]
  ```

  **Example 2:**
  ```
  Input: nums = [0,0,1,1,1,2,2,3,3,4]
  Output: [0,1,2,3,4]
  ```

  **Constraints:**
  - `1 <= nums.length <= 3 * 10^4`
  - `-100 <= nums[i] <= 100`
  - `nums` is sorted in non-decreasing order.
signature:
  name:
    javascript: removeDuplicates
    python: remove_duplicates
  params:
    - { name: nums, type: 'int[]' }
  returns: 'int[]'
starter:
  javascript: |
    function removeDuplicates(nums) {
      // Your code here
      return [];
    }
  python: |
    def remove_duplicates(nums):
        # Your code here
        return []
tests:
  - { args: [[1, 1, 2]],                              expected: [1, 2] }
  - { args: [[0, 0, 1, 1, 1, 2, 2, 3, 3, 4]],         expected: [0, 1, 2, 3, 4] }
  - { args: [[1]],                                    expected: [1] }
  - { args: [[1, 1, 1]],                              expected: [1], hidden: true }
  - { args: [[-3, -3, -2, -1, -1, 0, 0, 0]],          expected: [-3, -2, -1, 0], hidden: true }
hints:
  - Because the input is already sorted, every duplicate of an element sits right next to it. You only ever need to compare neighbors.
  - Use two pointers — a `slow` write index and a `fast` read index. Advance `fast` through the array; only write when `nums[fast]` differs from the previous kept element.
  - After the walk, the first `slow + 1` slots contain the unique values in order.
solution: |
  The sorted input means duplicates live in contiguous runs. A two-pointer walk handles each run in `O(1)` extra space — `slow` tracks where the next unique element should be written, `fast` scans forward looking for new values.

  ```javascript
  function removeDuplicates(nums) {
      if (nums.length === 0) return [];
      let slow = 0;
      for (let fast = 1; fast < nums.length; fast++) {
          if (nums[fast] !== nums[slow]) {
              nums[++slow] = nums[fast];
          }
      }
      return nums.slice(0, slow + 1);
  }
  ```

  ```python
  def remove_duplicates(nums):
      if not nums:
          return []
      slow = 0
      for fast in range(1, len(nums)):
          if nums[fast] != nums[slow]:
              slow += 1
              nums[slow] = nums[fast]
      return nums[: slow + 1]
  ```

  Each index is visited at most once, so the running time is `O(n)` with `O(1)` auxiliary space.
