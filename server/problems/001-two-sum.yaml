id: problem-001-two-sum
title: Two Sum
difficulty: EASY
tags:
  - arrays
  - hash-table
description: |
  Given an array of integers `nums` and an integer `target`, return indices of the two numbers such that they add up to `target`.

  You may assume that each input would have exactly one solution, and you may not use the same element twice.

  **Input format:** Line 1 is a JSON array of integers. Line 2 is the target integer.
  **Output format:** A JSON array of two indices (no spaces), e.g. `[0,1]`.

  **Example 1:**
  ```
  Input:
  [2,7,11,15]
  9
  Output: [0,1]
  ```

  **Example 2:**
  ```
  Input:
  [3,2,4]
  6
  Output: [1,2]
  ```
