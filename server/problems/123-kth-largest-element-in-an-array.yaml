tests:
  - { args: [[3, 2, 1, 5, 6, 4], 2],             expected: 5 }
  - { args: [[3, 2, 3, 1, 2, 4, 5, 5, 6], 4],    expected: 4 }
  - { args: [[1], 1],                            expected: 1 }
  - { args: [[7, 7, 7, 7], 2],                   expected: 7 }
  - { args: [[-1, -2, -3, -4], 2],               expected: -2, hidden: true }
  - { args: [[5, 3, 8, 1, 9, 2, 7], 3],          expected: 7, hidden: true }
hints:
  - Sorting and indexing works in `O(n log n)` — that's a fine first answer, but a heap can be a tighter fit.
  - Maintain a **min-heap of size `k`**. Push every element; whenever the heap exceeds size `k`, pop the smallest. The root at the end is the `k`-th largest.
  - In JavaScript the harness provides `MinHeap`. In Python use `heapq.heappush` / `heapq.heappop` (it's a min-heap by default).
solution: |
  Maintain a min-heap of size `k`. After processing the whole array, the heap holds the `k` largest elements with the smallest of them at the top — that root is the `k`-th largest.

  Time: `O(n log k)`. Space: `O(k)`.

  ```javascript
  function findKthLargest(nums, k) {
    const heap = new MinHeap();
    for (const x of nums) {
      heap.push(x);
      if (heap.size() > k) heap.pop();
    }
    return heap.peek();
  }
  ```

  ```python
  import heapq

  def find_kth_largest(nums, k):
      heap = []
      for x in nums:
          heapq.heappush(heap, x)
          if len(heap) > k:
              heapq.heappop(heap)
      return heap[0]
  ```

  An alternative is `O(n)` average-case Quickselect — partition around a pivot until the pivot lands at index `n - k` from the start. The heap version is simpler and is the canonical "this is a heap problem" pattern.
