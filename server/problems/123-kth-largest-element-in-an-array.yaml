id: problem-123-kth-largest-element-in-an-array
title: Kth Largest Element in an Array
difficulty: MEDIUM
tags:
  - arrays
  - heap
  - sorting
description: |
  Given an integer array `nums` and an integer `k`, return the `k`-th largest element in the array.

  Note that this is the `k`-th largest element in **sorted order**, not the `k`-th distinct element.

  **Example 1:**

  **Input:** `nums = [3,2,1,5,6,4]`, `k = 2`

  **Output:** `5`

  **Example 2:**

  **Input:** `nums = [3,2,3,1,2,4,5,5,6]`, `k = 4`

  **Output:** `4`

  **Constraints:**

  - `1 <= k <= nums.length <= 10^5`
  - `-10^4 <= nums[i] <= 10^4`

  **JavaScript:** the harness exposes `MinHeap` and `MaxHeap` classes with `push(v)`, `pop()`, `peek()`, and `size()`. Both accept an optional initial array and an optional `(a, b) => number` comparator.

  **Python:** use the built-in `heapq` module.
signature:
  name:
