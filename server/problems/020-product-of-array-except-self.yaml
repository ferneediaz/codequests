id: problem-020-product-of-array-except-self
title: Product of Array Except Self
difficulty: MEDIUM
tags:
  - arrays
  - prefix-sum
description: |
  Given an integer array `nums`, return an array `answer` such that `answer[i]` is the product of all elements of `nums` except `nums[i]`.

  The product is guaranteed to fit in a 32-bit integer. **You must solve it without using division** and in `O(n)` time.

  **Example 1:**
  ```
  Input: nums = [1,2,3,4]
  Output: [24,12,8,6]
  ```

  **Example 2:**
  ```
  Input: nums = [-1,1,0,-3,3]
  Output: [0,0,9,0,0]
  ```

  **Constraints:**
  - `2 <= nums.length <= 10^5`
  - `-30 <= nums[i] <= 30`

  **Follow-up:** can you do it in `O(1)` extra space (the output array doesn't count)?
signature:
  name:
    javascript: productExceptSelf
    python: product_except_self
  params:
    - { name: nums, type: 'int[]' }
  returns: 'int[]'
starter:
  javascript: |
    function productExceptSelf(nums) {
      // Your code here
      return [];
    }
  python: |
    def product_except_self(nums):
        # Your code here
        return []
tests:
  - { args: [[1, 2, 3, 4]],            expected: [24, 12, 8, 6] }
  - { args: [[-1, 1, 0, -3, 3]],       expected: [0, 0, 9, 0, 0] }
  - { args: [[2, 3]],                  expected: [3, 2] }
  - { args: [[1, 1]],                  expected: [1, 1], hidden: true }
  - { args: [[5, 0, 0, 5]],            expected: [0, 0, 0, 0], hidden: true }
hints:
  - Without division, the answer at index `i` is `(product of everything to the left of i) * (product of everything to the right of i)`.
  - Two passes work — fill `answer[i]` with the **prefix product** on the way forward, then multiply each entry by a running **suffix product** on the way back.
  - You can do the suffix pass in `O(1)` extra space by carrying a single running variable `right` and updating `answer[i] *= right` as you go.
solution: |
  The trick is to avoid division (which would explode on zeros) by computing prefix and suffix products separately.

  - Forward pass: `answer[i]` ← product of `nums[0..i-1]`.
  - Backward pass: multiply each `answer[i]` by the running product of `nums[i+1..n-1]`.

  Carrying the suffix product in a single variable keeps the auxiliary space at `O(1)` (the output buffer doesn't count).

  ```javascript
  function productExceptSelf(nums) {
      const n = nums.length;
      const answer = new Array(n);
      answer[0] = 1;
      for (let i = 1; i < n; i++) {
          answer[i] = answer[i - 1] * nums[i - 1];
      }
      let right = 1;
      for (let i = n - 1; i >= 0; i--) {
          answer[i] *= right;
          right *= nums[i];
      }
      return answer;
  }
  ```

  ```python
  def product_except_self(nums):
      n = len(nums)
      answer = [1] * n
      for i in range(1, n):
          answer[i] = answer[i - 1] * nums[i - 1]
      right = 1
      for i in range(n - 1, -1, -1):
          answer[i] *= right
          right *= nums[i]
      return answer
  ```

  Two linear passes — `O(n)` time and `O(1)` extra space.
