description: |
  Given a string `s`, find the length of the longest substring without repeating characters.

  **Input format:** A single line containing the string `s` (may be empty).
  **Output format:** A single integer.

  **Example 1:**
  ```
  Input: abcabcbb
  Output: 3
  ```

  **Example 2:**
  ```
  Input: bbbbb
  Output: 1
  ```

  **Example 3:**
  ```
  Input: pwwkew
  Output: 3
  ```
