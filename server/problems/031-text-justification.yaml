id: problem-031-text-justification
title: Text Justification
difficulty: HARD
tags:
  - strings
  - greedy
  - simulation
description: |
  Given an array of strings `words` and a width `maxWidth`, format the text such that each line has **exactly** `maxWidth` characters and is **fully (left and right) justified**.

  Pack words greedily — fit as many words as possible per line. Pad with **extra spaces** between words so each line is exactly `maxWidth` characters long.

  Extra spaces between words should be distributed as evenly as possible. If the number of spaces does not divide evenly, the **empty slots on the left** will receive more spaces than the slots on the right.

  For the **last line of text**, it should be left-justified, and **no extra space is inserted between words**. The last line is padded with trailing spaces only.

  Notes:
  - A single word per line should be left-justified with the rest of the line filled with spaces (no different from the last-line rule).
  - Each `words[i]` is guaranteed to be `<= maxWidth` so it fits on its own line.

  **Example 1:**
  ```
  Input: words = ["This", "is", "an", "example", "of", "text", "justification."], maxWidth = 16
  Output:
  [
     "This    is    an",
     "example  of text",
     "justification.  "
  ]
  ```

  **Example 2:**
  ```
  Input: words = ["What","must","be","acknowledgment","shall","be"], maxWidth = 16
  Output:
  [
    "What   must   be",
    "acknowledgment  ",
    "shall be        "
  ]
  ```

  **Constraints:**
  - `1 <= words.length <= 300`
  - `1 <= words[i].length <= 20`
  - `1 <= maxWidth <= 100`
  - `words[i].length <= maxWidth`
signature:
  name:
    javascript: fullJustify
    python: full_justify
  params:
    - { name: words,    type: 'string[]' }
    - { name: maxWidth, type: int }
  returns: 'string[]'
starter:
