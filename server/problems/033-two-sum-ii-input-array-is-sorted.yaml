id: problem-033-two-sum-ii-input-array-is-sorted
title: Two Sum II - Input Array Is Sorted
difficulty: MEDIUM
tags:
  - arrays
  - two-pointers
  - binary-search
description: |
  Given a **1-indexed** array of integers `numbers` that is already sorted in **non-decreasing** order, find two numbers such that they add up to a specific `target`.

  Return the indices of the two numbers (`index1` and `index2`) added by one as an integer array `[index1, index2]` of length 2.

  Your solution must use **only constant extra space**.

  The tests are generated such that there is **exactly one solution**. You may not use the same element twice.

  **Example 1:**
  ```
  Input: numbers = [2,7,11,15], target = 9
  Output: [1,2]
  Explanation: numbers[0] + numbers[1] = 2 + 7 = 9. So index1 = 1, index2 = 2.
  ```

  **Example 2:**
  ```
  Input: numbers = [2,3,4], target = 6
  Output: [1,3]
  ```

  **Example 3:**
  ```
  Input: numbers = [-1,0], target = -1
  Output: [1,2]
  ```

  **Constraints:**
  - `2 <= numbers.length <= 3 * 10^4`
  - `-1000 <= numbers[i] <= 1000`
  - `numbers` is sorted in non-decreasing order.
  - `-1000 <= target <= 1000`
  - The tests are generated such that there is exactly one solution.
signature:
  name:
    javascript: twoSum
    python: two_sum
  params:
    - { name: numbers, type: 'int[]' }
    - { name: target,  type: int }
  returns: 'int[]'
starter:
  javascript: |
