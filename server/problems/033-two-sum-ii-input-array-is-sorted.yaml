tests:
  - { args: [[2, 7, 11, 15], 9],         expected: [1, 2] }
  - { args: [[2, 3, 4], 6],              expected: [1, 3] }
  - { args: [[-1, 0], -1],               expected: [1, 2] }
  - { args: [[1, 2, 3, 4, 4, 9, 56, 90], 8], expected: [4, 5], hidden: true }
  - { args: [[5, 25, 75], 100],          expected: [2, 3], hidden: true }
hints:
  - The sortedness is the key — a hash map ignores it. Try two pointers from each end.
  - If `numbers[left] + numbers[right] < target`, the only way to grow the sum is to move `left` forward; if it's too big, move `right` backward. The pointers can never miss the answer.
  - Don't forget the result is **1-indexed**, not 0-indexed.
solution: |
  Two pointers from each end of the sorted array. If the sum is too small move `left` right; if it's too big move `right` left. The two pointers can never skip past the answer because the array is sorted: at any moment, every smaller sum involving `left` requires moving `right` further left, and similarly for the other side.

  ```javascript
  function twoSum(numbers, target) {
      let left = 0, right = numbers.length - 1;
      while (left < right) {
          const sum = numbers[left] + numbers[right];
          if (sum === target) return [left + 1, right + 1];
          if (sum < target) left++;
          else right--;
      }
      return [];
  }
  ```

  ```python
  def two_sum(numbers, target):
      left, right = 0, len(numbers) - 1
      while left < right:
          total = numbers[left] + numbers[right]
          if total == target:
              return [left + 1, right + 1]
          if total < target:
              left += 1
          else:
              right -= 1
      return []
  ```

  One walk inward — `O(n)` time and `O(1)` space.
