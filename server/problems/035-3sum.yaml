id: problem-035-3sum
title: 3Sum
difficulty: MEDIUM
tags:
  - arrays
  - two-pointers
  - sorting
description: |
  Given an integer array `nums`, return all the triplets `[nums[i], nums[j], nums[k]]` such that `i != j`, `i != k`, and `j != k`, and `nums[i] + nums[j] + nums[k] == 0`.

  Notice that the solution set must **not contain duplicate** triplets.

  > **Output ordering (grading):** to keep the auto-grader deterministic, return each triplet with its values in non-decreasing order, and sort the outer list lexicographically. The canonical "sort + two pointer" solution produces exactly this ordering automatically.

  **Example 1:**
  ```
  Input: nums = [-1,0,1,2,-1,-4]
  Output: [[-1,-1,2],[-1,0,1]]
  ```

  **Example 2:**
  ```
  Input: nums = [0,1,1]
  Output: []
  ```

  **Example 3:**
  ```
  Input: nums = [0,0,0]
  Output: [[0,0,0]]
  ```

  **Constraints:**
  - `3 <= nums.length <= 3000`
  - `-10^5 <= nums[i] <= 10^5`
signature:
  name:
    javascript: threeSum
    python: three_sum
  params:
