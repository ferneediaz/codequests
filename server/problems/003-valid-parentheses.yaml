id: problem-003-valid-parentheses
title: Valid Parentheses
difficulty: EASY
tags:
  - strings
  - stacks
description: |
  Given a string `s` containing just the characters `(`, `)`, `{`, `}`, `[` and `]`, determine if the input string is valid.

  An input string is valid if:
  1. Open brackets must be closed by the same type of brackets.
  2. Open brackets must be closed in the correct order.
  3. Every close bracket has a corresponding open bracket of the same type.

  **Example 1:**
  ```
  Input: "()"
  Output: true
  ```

  **Example 2:**
  ```
  Input: "()[]{}"
  Output: true
  ```

  **Example 3:**
  ```
  Input: "(]"
  Output: false
  ```
signature:
  name:
    javascript: isValid
    python: is_valid
  params:
    - { name: s, type: string }
  returns: bool
starter:
  javascript: |
    function isValid(s) {
      // Your code here
      return false;
    }
  python: |
    def is_valid(s):
        # Your code here
        return False
tests:
  - { args: ["()"],        expected: true }
  - { args: ["()[]{}"],    expected: true }
  - { args: ["(]"],        expected: false }
  - { args: ["{[()]}"],    expected: true,  hidden: true }
  - { args: ["([)]"],      expected: false, hidden: true }
hints:
  - The most recently opened bracket must be the next one closed. Which data structure gives you "most recent" in O(1)?
  - Push every opening bracket onto a stack. When you see a closing bracket, it must match the top of the stack.
  - Don't forget the edge cases. If the stack is empty when you encounter a closing bracket, or if anything is left on the stack at the end, the string is invalid.
solution: |
  A stack is a natural fit because bracket nesting is last-in / first-out. Walk the string once; push opening brackets, and for each closing bracket pop the top of the stack and verify it's the matching partner.

  ```javascript
  function isValid(s) {
      const pairs = { ')': '(', ']': '[', '}': '{' };
      const stack = [];
      for (const ch of s) {
          if (ch === '(' || ch === '[' || ch === '{') {
              stack.push(ch);
          } else {
              if (stack.pop() !== pairs[ch]) return false;
          }
      }
      return stack.length === 0;
  }
  ```

  ```python
  def is_valid(s):
      pairs = {')': '(', ']': '[', '}': '{'}
      stack = []
      for ch in s:
          if ch in '([{':
              stack.append(ch)
          else:
              if not stack or stack.pop() != pairs[ch]:
                  return False
      return not stack
  ```

  Both time and space are `O(n)` in the worst case.
