testCases:
  - { input: "()",       expectedOutput: "true",  hidden: false }
  - { input: "()[]{}",   expectedOutput: "true",  hidden: false }
  - { input: "(]",       expectedOutput: "false", hidden: false }
  - { input: "{[()]}",   expectedOutput: "true",  hidden: true }
  - { input: "([)]",     expectedOutput: "false", hidden: true }
