id: problem-029-zigzag-conversion
title: Zigzag Conversion
difficulty: MEDIUM
tags:
  - strings
  - simulation
description: |
  The string `"PAYPALISHIRING"` is written in a zigzag pattern on a given number of rows like this (you may want to display this pattern in a fixed-width font for better legibility):

  ```
  P   A   H   N
  A P L S I I G
  Y   I   R
  ```

  And then read line by line: `"PAHNAPLSIIGYIR"`.

  Write the code that will take a string and make this conversion given a number of rows:

  ```
  string convert(string s, int numRows);
  ```

  **Example 1:**
  ```
  Input: s = "PAYPALISHIRING", numRows = 3
  Output: "PAHNAPLSIIGYIR"
  ```

  **Example 2:**
  ```
  Input: s = "PAYPALISHIRING", numRows = 4
  Output: "PINALSIGYAHRPI"
  Explanation:
  P     I    N
  A   L S  I G
  Y A   H R
  P     I
  ```

  **Example 3:**
  ```
  Input: s = "A", numRows = 1
  Output: "A"
  ```

  **Constraints:**
  - `1 <= s.length <= 1000`
  - `s` consists of English letters (lower- and upper-case), `','` and `'.'`.
  - `1 <= numRows <= 1000`
signature:
  name:
    javascript: convert
    python: convert
  params:
    - { name: s,       type: string }
    - { name: numRows, type: int }
  returns: string
starter:
  javascript: |
    function convert(s, numRows) {
      // Your code here
      return "";
    }
  python: |
    def convert(s, numRows):
        # Your code here
        return ""
tests:
  - { args: ["PAYPALISHIRING", 3],   expected: "PAHNAPLSIIGYIR" }
  - { args: ["PAYPALISHIRING", 4],   expected: "PINALSIGYAHRPI" }
  - { args: ["A", 1],                expected: "A" }
  - { args: ["AB", 1],               expected: "AB", hidden: true }
  - { args: ["ABC", 2],              expected: "ACB", hidden: true }
hints:
  - You don't actually need to fill a 2D grid. Just keep one buffer per row, append each character to its current row, and concatenate the buffers at the end.
  - Walk a "row index" up and down. Start at row `0` heading down; reverse direction whenever you hit row `0` or row `numRows - 1`.
  - Don't forget the `numRows == 1` edge case — the row never moves, so the answer is just `s`.
solution: |
  Simulate the zigzag with one string buffer per row. Iterate the input; append each character to the current row's buffer. Bounce the direction when you hit the top or bottom row. Concatenate the row buffers at the end.

  ```javascript
  function convert(s, numRows) {
      if (numRows === 1 || numRows >= s.length) return s;
      const rows = Array.from({ length: numRows }, () => []);
      let current = 0;
      let step = 1;
      for (const ch of s) {
          rows[current].push(ch);
          if (current === 0) step = 1;
          else if (current === numRows - 1) step = -1;
          current += step;
      }
      return rows.map(r => r.join('')).join('');
  }
  ```

  ```python
  def convert(s, numRows):
      if numRows == 1 or numRows >= len(s):
          return s
      rows = [[] for _ in range(numRows)]
      current, step = 0, 1
      for ch in s:
          rows[current].append(ch)
          if current == 0:
              step = 1
          elif current == numRows - 1:
              step = -1
          current += step
      return ''.join(''.join(r) for r in rows)
  ```

  Each character is appended exactly once and read exactly once for the final join: `O(n)` time and `O(n)` space.
