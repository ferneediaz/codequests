id: problem-023-trapping-rain-water
title: Trapping Rain Water
difficulty: HARD
tags:
  - arrays
  - two-pointers
  - dynamic-programming
description: |
  Given `n` non-negative integers representing an elevation map where the width of each bar is `1`, compute how much water it can trap after raining.

  **Example 1:**
  ```
  Input: height = [0,1,0,2,1,0,1,3,2,1,2,1]
  Output: 6
  ```

  **Example 2:**
  ```
  Input: height = [4,2,0,3,2,5]
  Output: 9
  ```

  **Constraints:**
  - `n == height.length`
  - `1 <= n <= 2 * 10^4`
  - `0 <= height[i] <= 10^5`
signature:
  name:
    javascript: trap
    python: trap
  params:
    - { name: height, type: 'int[]' }
  returns: int
starter:
  javascript: |
    function trap(height) {
      // Your code here
      return 0;
    }
  python: |
    def trap(height):
        # Your code here
        return 0
tests:
  - { args: [[0, 1, 0, 2, 1, 0, 1, 3, 2, 1, 2, 1]],   expected: 6 }
  - { args: [[4, 2, 0, 3, 2, 5]],                      expected: 9 }
  - { args: [[1, 1, 1]],                               expected: 0 }
  - { args: [[5]],                                     expected: 0, hidden: true }
  - { args: [[3, 0, 0, 2, 0, 4]],                      expected: 10, hidden: true }
hints:
  - The water above each bar `i` is `min(maxLeft[i], maxRight[i]) - height[i]`. Computing those two arrays first gives you an `O(n)` time / `O(n)` space solution.
  - Can you avoid the auxiliary arrays? Two pointers from each end let you process the bars in the right order so that the smaller of the two running maxes is **provably** the limiting wall.
  - At each step, advance the side whose running max is smaller. The water there is bounded by the max on that side, because the other side is even taller.
solution: |
  Two pointers from each end, `O(n)` time and `O(1)` extra space.

  Maintain `leftMax` and `rightMax`, the highest bars seen so far on each side. The bar whose running max is the **smaller** of the two is the bottleneck for water at the corresponding index — water there is bounded by that max regardless of what's beyond. Process that side, add `runningMax - height` to the answer, and step its pointer inward.

  ```javascript
  function trap(height) {
      let l = 0, r = height.length - 1;
      let leftMax = 0, rightMax = 0;
      let water = 0;
      while (l < r) {
          if (height[l] < height[r]) {
              if (height[l] >= leftMax) leftMax = height[l];
              else water += leftMax - height[l];
              l++;
          } else {
              if (height[r] >= rightMax) rightMax = height[r];
              else water += rightMax - height[r];
              r--;
          }
      }
      return water;
  }
  ```

  ```python
  def trap(height):
      l, r = 0, len(height) - 1
      left_max = right_max = 0
      water = 0
      while l < r:
          if height[l] < height[r]:
              if height[l] >= left_max:
                  left_max = height[l]
              else:
                  water += left_max - height[l]
              l += 1
          else:
              if height[r] >= right_max:
                  right_max = height[r]
              else:
                  water += right_max - height[r]
              r -= 1
      return water
  ```

  Each index is visited once — `O(n)` time and `O(1)` space.
